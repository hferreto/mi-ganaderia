<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

header select option{color:#000}

main{max-width:900px;margin:0 auto;padding:14px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}

h2{font-size:19px;margin:6px 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}

.btn.sec{background:transparent;color:var(--pri)}

.av{width:40px;height:40px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}

.muted{color:var(--muted)}

.av.img{background-size:cover;background-position:center;color:transparent}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column}

[hidden]{display:none!important}
.lk{text-decoration:none;color:inherit;min-width:0}.ag .btn{flex:none;white-space:nowrap}
.ag .av{background:var(--pri2)}.ag.sanidad .av{background:var(--info2)}.ag.manejo .av{background:var(--warn2)}.ag.mias .av{background:var(--bad2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.cal button{position:relative;min-height:50px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.cal button.hoy{border-color:var(--pri);font-weight:700}
.cal button.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.cal button.atr span{color:var(--bad)}.cal button.sel.atr span{color:#fff}
.cal i{display:flex;gap:2px}.cal small{font-size:10px;color:var(--muted)}.cal button.sel small{color:#fff}
.cal em,.ley em{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pri)}
em.sanidad{background:var(--info)}em.manejo{background:var(--warn)}em.mias{background:var(--bad)}
.ley{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--muted)}.ley em{margin-right:4px}
.upl{position:relative;overflow:hidden}.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
nav a{font-size:10.5px}
</style>

<script>
"use strict";
/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const D=f=>new Date(f+'T12:00:00');
const dias=(a,b)=>Math.round((D(b)-D(a))/864e5);
const addDias=(f,n)=>{const d=D(f);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtF=f=>f?D(f).toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const num=(v,d=1)=>v==null||v===''||isNaN(v)?'—':Number(v).toLocaleString('es-CR',{maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function edadTxt(f){if(!f)return'—';const m=dias(f,hoy())/30.44;if(m<1)return dias(f,hoy())+' días';if(m<24)return Math.floor(m)+' meses';const a=Math.floor(m/12),r=Math.floor(m%12);return a+' años'+(r?' '+r+' m':'')}

/* ================= Catálogos ================= */
const ESPECIES={
 bovino:{n:'Bovino',gest:283,destete:8,crec:12,adulto:24,viejo:144,H:['Ternera','Destetada','Novilla','Vaca','Vaca vieja'],M:['Ternero','Destetado','Novillo','Toro','Toro viejo']},
 bufalino:{n:'Bufalino',gest:310,destete:8,crec:12,adulto:30,viejo:180,H:['Bucerra','Destetada','Bubilla','Búfala','Búfala vieja'],M:['Bucerro','Destetado','Bubillo','Búfalo','Búfalo viejo']},
 caprino:{n:'Caprino',gest:150,destete:3,crec:5,adulto:12,viejo:96,H:['Cabrita','Destetada','Primala','Cabra','Cabra vieja'],M:['Cabrito','Destetado','Primal','Macho cabrío','Macho viejo']},
 ovino:{n:'Ovino',gest:147,destete:3,crec:5,adulto:12,viejo:96,H:['Cordera','Destetada','Borrega','Oveja','Oveja vieja'],M:['Cordero','Destetado','Borrego','Carnero','Carnero viejo']},
 equino:{n:'Equino',gest:340,destete:6,crec:12,adulto:36,viejo:240,H:['Potranca','Destetada','Potranca','Yegua','Yegua vieja'],M:['Potrillo','Destetado','Potro','Caballo','Caballo viejo']},
 porcino:{n:'Porcino',gest:114,destete:1,crec:3,adulto:8,viejo:48,H:['Lechona','Destetada','Primeriza','Cerda','Cerda vieja'],M:['Lechón','Destetado','Cerdito','Verraco','Verraco viejo']}
};
const ETAPAS=['Cría','Destetado','En crecimiento','Adulto','Viejo'];
const RAZAS=['Brahman','Brahman rojo','Nelore','Gyr','Guzerat','Indubrasil','Holstein','Jersey','Pardo Suizo','Guernsey','Simmental','Simbrah','Angus','Brangus','Charolais','Senepol','Beefmaster','Romosinuano','Criollo','Cruzado','Mestizo','Girolando','Jersey x Holstein'];
const PROPOSITOS=['Leche','Carne','Doble propósito','Cría','Levante','Reproductor'];
const VACUNAS=['Brucelosis','Ántrax (carbunco)','Clostridiales (pierna negra)','Rabia','Leptospirosis','IBR / DVB','Complejo respiratorio','Complejo reproductivo','Fiebre aftosa','Pasteurelosis','Otra'];
const TIPOS_TRAT=['Antibiótico','Antiparasitario','Antiinflamatorio','Vitaminas / minerales','Hormonal / reproductivo','Preventivo','Otro'];
const SEVERIDAD=['Subclínica','Leve','Moderada','Grave'];
const CAUSAS=['Enfermedad','Accidente','Parto / aborto','Ataque animal','Envenenamiento','Desaparecido','Otra'];
const DIETAS=['Pastoreo','Pastoreo + concentrado','Estabulado','Semiestabulado','Otro'];

/* Tipos de evento: [clave, etiqueta, tipo, opciones] */
const TIPOS={
 peso:{n:'Pesaje',ic:'⚖️',c:[['valor','Peso (kg)','number']]},
 leche:{n:'Leche',ic:'🥛',sexo:'H',c:[['manana','Mañana (L)','number'],['tarde','Tarde (L)','number']]},
 celo:{n:'Celo',ic:'💗',sexo:'H',c:[]},
 servicio:{n:'Servicio / IA',ic:'🧬',sexo:'H',c:[['metodo','Método','select',['Monta natural','Inseminación artificial','Transferencia de embriones']],['toro','Toro o pajilla','text'],['costo','Costo (opcional)','number']]},
 chequeo:{n:'Chequeo preñez',ic:'🩺',sexo:'H',c:[['resultado','Resultado','select',['Preñada','Vacía']],['mesesG','Meses de preñez (aprox., si no hay servicio registrado)','number'],['partoProb','Fecha probable de parto (si la sabés)','date']]},
 parto:{n:'Parto',ic:'🍼',sexo:'H',c:[['sexoCria','Sexo de la cría','select',['Hembra','Macho','Sin cría viva']],['codigoCria','Código de la cría (se crea el animal)','text'],['pesoCria','Peso al nacer (kg)','number']]},
 aborto:{n:'Aborto',ic:'⚠️',sexo:'H',c:[]},
 secado:{n:'Secado',ic:'⏸️',sexo:'H',c:[['producto','Tratamiento de secado','text']]},
 vacuna:{n:'Vacuna',ic:'💉',c:[['producto','Vacuna','select',VACUNAS],['dosis','Dosis','text'],['proxima','Próxima dosis','date'],['costo','Costo (opcional)','number']]},
 desparasitacion:{n:'Desparasitación',ic:'🪱',c:[['producto','Producto','text'],['proxima','Próxima aplicación','date'],['costo','Costo (opcional)','number']]},
 tratamiento:{n:'Tratamiento',ic:'💊',c:[['tipoT','Tipo','select',TIPOS_TRAT],['diagnostico','Diagnóstico','text'],['producto','Medicamento','text'],['duracion','Días de tratamiento','number'],['retiro','Días de retiro leche/carne','number'],['costo','Costo (opcional)','number']]},
 mastitis:{n:'Mastitis',ic:'🔴',sexo:'H',c:[['severidad','Severidad','select',SEVERIDAD],['cuartos','Cuartos afectados','text']]},
 lote:{n:'Cambio de lote o finca',ic:'🔀',c:[['destino','Lote o potrero destino','lote']]},
 venta:{n:'Venta',ic:'💰',c:[['comprador','Comprador','text'],['peso','Peso (kg)','number'],['precio','Precio total','number']]},
 muerte:{n:'Muerte',ic:'✝️',c:[['causa','Causa','select',CAUSAS]]},
 nota:{n:'Observación',ic:'📝',c:[]}
};

/* ================= Base de datos (IndexedDB) ================= */
const STORES=['fincas','lotes','animales','eventos','archivos','movimientos','tareas','config','tombs','blobs'];
const DATA=['fincas','lotes','animales','eventos','archivos','movimientos','tareas'];
let db, S={fincas:[],lotes:[],animales:[],eventos:[],archivos:[],movimientos:[],tareas:[],config:{}};
const CFG0={fincaActual:null,moneda:'₡',secado:305,esperaVol:60,alertaParto:15,diasChequeo:45,celoDesde:18,celoHasta:24,secarAntesParto:60};
/* N = configuración de la nube (solo de este dispositivo, no se sincroniza) */
const NUBE_URL='https://ioljiwrrypodbiqeamzi.supabase.co', NUBE_KEY='sb_publishable__szpsGCEHdHGlhHuUadErw_IBU0-Rrq';
let N={id:'nube',url:NUBE_URL,key:NUBE_KEY,userId:null,email:'',pull:{},cfgDirty:false,ultimaSync:null};
function openDB(){return new Promise((ok,ko)=>{const r=indexedDB.open('mi-ganado',4);r.onupgradeneeded=()=>{STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})}
function tx(store,mode,fn){return new Promise((ok,ko)=>{const t=db.transaction(store,mode);const o=t.objectStore(store);const res=fn(o);t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>ko(t.error)})}
async function loadAll(){for(const s of STORES){if(s==='tombs'||s==='blobs')continue;const rows=await tx(s,'readonly',o=>o.getAll());if(s==='config'){const c=rows.find(r=>r.id==='cfg');S.config=Object.assign({},CFG0,c||{});delete S.config.id;const n=rows.find(r=>r.id==='nube');if(n)N=Object.assign(N,n)}else S[s]=rows||[]}}
/* put: guarda y marca el registro como pendiente de subir (_s=0) */
async function put(store,obj){obj.mod=Date.now();obj._s=0;await putRaw(store,obj);Sync.pronto()}
async function putRaw(store,obj){await tx(store,'readwrite',o=>o.put(obj));const arr=S[store];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj)}
async function del(store,id){await delRaw(store,id);if(N.userId)await tx('tombs','readwrite',o=>o.put({id:store+':'+id,store,rid:id}));Sync.pronto()}
async function delRaw(store,id){await tx(store,'readwrite',o=>o.delete(id));S[store]=S[store].filter(x=>x.id!==id)}
async function saveCfg(){await tx('config','readwrite',o=>o.put(Object.assign({},S.config,{id:'cfg'})));N.cfgDirty=true;N.cfgMod=Date.now();await saveN();Sync.pronto()}
async function saveN(){await tx('config','readwrite',o=>o.put(Object.assign({},N,{id:'nube'})))}
async function borrarLocal(){for(const s of STORES)await tx(s,'readwrite',o=>o.clear());S={fincas:[],lotes:[],animales:[],eventos:[],archivos:[],movimientos:[],config:Object.assign({},CFG0)};for(const k in URLS){URL.revokeObjectURL(URLS[k]);delete URLS[k]}}

/* ================= Sincronización con Supabase ================= */
const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const MAP={
 fincas:[['nombre'],['proposito'],['especie'],['ubicacion'],['areaTotal','area_total','n'],['areaGanado','area_ganado','n']],
 lotes:[['fincaId','finca_id'],['nombre'],['tipo'],['area','area','n']],
 animales:[['fincaId','finca_id'],['codigo'],['nombre'],['especie'],['sexo'],['fechaNac','fecha_nac','d'],['raza'],['proposito'],['loteId','lote_id'],['madreId','madre_id'],['padreId','padre_id'],['padreTxt','padre_txt'],['dieta'],['origen'],['fechaIngreso','fecha_ingreso','d'],['chip'],['nfc'],['qr'],['marca'],['notas'],['estado'],['fechaSalida','fecha_salida','d']],
 eventos:[['animalId','animal_id'],['fincaId','finca_id'],['tipo'],['fecha','fecha','d'],['datos','datos','j'],['notas']],
 archivos:[['fincaId','finca_id'],['animalId','animal_id'],['tipo'],['nombre'],['ruta'],['mime'],['tamano','tamano','n'],['fecha','fecha','d'],['notas'],['portada','portada','b']],
 tareas:[['fincaId','finca_id'],['tipo'],['titulo'],['fecha','fecha','d'],['hora'],['animalId','animal_id'],['loteId','lote_id'],['repetir'],['notas'],['hecha','hecha','b'],['fechaHecha','fecha_hecha','d']],
 movimientos:[['fincaId','finca_id'],['tipo'],['categoria'],['fecha','fecha','d'],['monto','monto','n'],['descripcion'],['cantidad','cantidad','n'],['unidad'],['precioUnit','precio_unit','n'],['animalId','animal_id'],['loteId','lote_id'],['tercero'],['eventoId','evento_id']]

 const r={estado:a.sexo==='H'?'Vacía':'',partos:0,ultParto:null,ultServ:null,concepcion:null,partoEsp:null,lactando:false,diasLact:null,diasAbiertos:null,ultCelo:null,chequeado:false};
 if(a.sexo!=='H')return r;

 for(const e of evDe(a.id)){const d=e.datos||{};

function agendaManual(desde,hasta){const out=[];
 for(const ta of tareasF()){if(ta.hecha)continue;const a=ta.animalId?animal(ta.animalId):null;
  const base={tarea:ta,a,ic:TT(ta.tipo)[1],cat:'mias',t:ta.titulo||TT(ta.tipo)[2],d:[ta.hora,a?nombreA(a):'',ta.loteId?'Lote: '+loteN(ta.loteId):'',ta.notas].filter(Boolean).join(' · '),href:accionTarea(ta)};
  out.push(Object.assign({},base,{fecha:ta.fecha}));
  if(ta.repetir)for(let k=1;k<400;k++){const f=sigFecha(ta.fecha,ta.repetir,k);if(f>hasta)break;if(f>=desde)out.push(Object.assign({},base,{fecha:f,virtual:true,href:null}))}}
 return out}
function accionTarea(ta){const ev={vacuna:'vacuna',desparasitacion:'desparasitacion',pesaje:'peso'}[ta.tipo];if(!ev)return null;
 return ta.animalId?`#/evento/${ta.animalId}/${ev}`:`#/masivo/${ev}${ta.loteId?'/'+ta.loteId:''}`}

/* Todo junto, ordenado; agrupa vacunas del mismo día y producto */
function agendaItems(desde,hasta,agrupar=true){const t=hoy();
 let it=agendaAuto().filter(x=>x.fecha<=hasta&&(x.fecha>=desde||(x.fecha<t&&!x.info&&x.fecha>=addDias(t,-180)&&desde<=t)));
 if(agrupar){const g={},resto=[];for(const x of it){if(!x.grp){resto.push(x);continue}const k=x.fecha+'#'+x.grp;(g[k]=g[k]||[]).push(x)}
  for(const xs of Object.values(g)){if(xs.length===1){resto.push(xs[0]);continue}const x=xs[0];const ns=xs.map(y=>y.a.codigo);
   resto.push(Object.assign({},x,{a:null,grupo:xs.map(y=>y.a),d:`${xs.length} animales: ${ns.slice(0,6).join(', ')}${ns.length>6?' y '+(ns.length-6)+' más':''}`,href:`#/masivo/${x.masivo}`,btn:'Registrar en grupo'}))}
  it=resto}
 it=it.concat(agendaManual(desde,hasta).filter(x=>x.fecha<=hasta&&(x.fecha>=desde||x.fecha<t)));
 return it.sort((x,y)=>x.fecha.localeCompare(y.fecha)||(x.tarea?1:0)-(y.tarea?1:0))}

function agItem(x){const t=hoy(),atras=x.fecha<t&&!x.info;
 const sub=[x.a&&!x.tarea?nombreA(x.a):'',x.d].filter(Boolean).join(' · ');
 const lk=x.tarea?`#/tarea/${x.tarea.id}`:x.a?`#/animal/${x.a.id}`:x.href||'#/agenda';
 const btn=!puede('registrar')?'':x.virtual?'<span class="sub">🔁</span>':x.tarea?`${x.href?`<a class="btn sm sec" href="${x.href}" title="Registrar">✍️</a>`:''}<button class="btn sm" data-hecha="${x.tarea.id}" title="Marcar como hecha">✓</button>`:x.href?`<a class="btn sm sec" href="${x.href}">${x.btn==='Ver'?'Ver':'Registrar'}</a>`:'';
 return`<div class="it ag ${x.cat}"><div class="av">${x.ic}</div><a class="sp lk" href="${lk}"><b>${esc(x.t)}</b><div class="sub">${esc(sub)}${atras?` · <span class="neg">atrasada ${dias(x.fecha,t)} d</span>`:''}</div></a>${btn}</div>`}

async function marcarHecha(id){const ta=S.tareas.find(x=>x.id===id);if(!ta)return;ta.hecha=true;ta.fechaHecha=hoy();await put('tareas',ta);let msg='Tarea hecha ✓';
 if(ta.repetir){let f=sigFecha(ta.fecha,ta.repetir);while(f<hoy())f=sigFecha(f,ta.repetir);const {id:_,hecha,fechaHecha,mod,_s,...resto}=ta;await put('tareas',Object.assign(resto,{id:uid(),fecha:f,hecha:false,fechaHecha:''}));msg+=' · Próxima: '+fmtF(f)}
 toast(msg);route()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-hecha]');if(b){e.preventDefault();marcarHecha(b.dataset.hecha)}});

function agendaCard(){const t=hoy(),it=agendaItems(t,addDias(t,7)).filter(x=>!x.virtual||x.fecha<=addDias(t,7));
 const atr=it.filter(x=>x.fecha<t&&!x.info),prox=it.filter(x=>x.fecha>=t);
 return`<div class="card"><div class="row"><b>📅 Agenda · próximos 7 días</b><span class="sp"></span><a class="btn sm sec" href="#/agenda">Ver agenda</a></div>

 <div class="list">${prox.slice(0,6).map(x=>agItem(x)).join('')||'<div class="empty">Nada programado para esta semana.</div>'}${prox.length>6?`<a class="sub" href="#/agenda">y ${prox.length-6} más…</a>`:''}</div></div>`}

const vAgenda=(modo,mes)=>{const t=hoy();const fl=x=>!AG.filtro||x.cat===AG.filtro;
 const head=`<div class="row"><h2 style="margin:0">📅 Agenda</h2><span class="sp"></span>${puede('registrar')?'<a class="btn sm" href="#/tarea/nueva">➕ Nueva tarea</a>':''}</div>
 <div class="row" style="margin:10px 0 4px;gap:6px"><a class="btn sm ${modo==='mes'?'sec':''}" href="#/agenda">📋 Lista</a><a class="btn sm ${modo==='mes'?'':'sec'}" href="#/agenda/mes">🗓️ Mes</a></div>
 <div class="tabs">${CAT_AG.map(([k,l])=>`<a href="#" data-fl="${k}" class="${AG.filtro===k?'on':''}">${l}</a>`).join('')}</div>

 let body='';
 if(modo!=='mes'){const it=agendaItems(t,addDias(t,60)).filter(fl);const atr=it.filter(x=>x.fecha<t&&!x.info),fut=it.filter(x=>x.fecha>=t);
  const grupos=[];for(const x of fut){const g=grupos[grupos.length-1];if(g&&g.f===x.fecha)g.xs.push(x);else grupos.push({f:x.fecha,xs:[x]})}
  const titulo=f=>{const n=dias(t,f);return n===0?'Hoy':n===1?'Mañana':fmtDia(f)};
  body=(atr.length?`<h3 class="neg">Atrasadas (${atr.length})</h3><div class="card list">${atr.map(agItem).join('')}</div>`:'')
   +(grupos.length?grupos.map(g=>`<h3>${titulo(g.f)}${dias(t,g.f)>1?` <span class="sub">· en ${dias(t,g.f)} días</span>`:''}</h3><div class="card list">${g.xs.map(agItem).join('')}</div>`).join(''):'<div class="card empty">No hay tareas en los próximos 60 días.</div>')
   +'<p class="sub">Las tareas automáticas salen de tus registros: partos esperados, secados, chequeos de preñez, celos, destetes, próximas vacunas y desparasitaciones. Se actualizan solas al registrar el evento. Los días se ajustan en Más → Parámetros.</p>'}
 else{const m=mes||t.slice(0,7);const ini=m+'-01',fin=addDias(addMeses(ini,1),-1);const it=agendaItems(ini,fin).filter(x=>x.fecha>=ini&&fl(x));
  const por={};for(const x of it)(por[x.fecha]=por[x.fecha]||[]).push(x);
  if(!AG.dia||AG.dia.slice(0,7)!==m)AG.dia=t.slice(0,7)===m?t:ini;
  const pad=(D(ini).getDay()+6)%7,nd=Number(fin.slice(8));let celdas='';for(let i=0;i<pad;i++)celdas+='<span></span>';
  for(let d=1;d<=nd;d++){const f=m+'-'+String(d).padStart(2,'0'),xs=por[f]||[];const cats=[...new Set(xs.map(x=>x.cat))];
   celdas+=`<button data-dia="${f}" class="${f===t?'hoy ':''}${f===AG.dia?'sel ':''}${xs.some(x=>x.fecha<t&&!x.info)?'atr':''}"><span>${d}</span>${xs.length?`<i>${cats.map(c=>`<em class="${c}"></em>`).join('')}</i><small>${xs.length}</small>`:''}</button>`}
  let nom=D(ini).toLocaleDateString('es-CR',{month:'long'})+' '+ini.slice(0,4);nom=nom[0].toUpperCase()+nom.slice(1);const sel=por[AG.dia]||[];
  body=`<div class="card"><div class="row"><a class="btn sm sec" href="#/agenda/mes/${addMeses(ini,-1).slice(0,7)}">◀</a><b class="sp" style="text-align:center">${nom}</b><a class="btn sm sec" href="#/agenda/mes/${addMeses(ini,1).slice(0,7)}">▶</a></div>
   <div class="cal" style="margin-top:10px">${['L','M','M','J','V','S','D'].map(x=>`<span class="h">${x}</span>`).join('')}${celdas}</div>
   <div class="ley"><span><em class="repro"></em>Reproducción</span><span><em class="sanidad"></em>Sanidad</span><span><em class="manejo"></em>Manejo</span><span><em class="mias"></em>Mis tareas</span></div></div>
   <div class="row"><h3 style="flex:1">${fmtDia(AG.dia)}</h3>${puede('registrar')?`<a class="btn sm sec" href="#/tarea/nueva//${AG.dia}">➕ Tarea este día</a>`:''}</div><div class="card list">${sel.map(agItem).join('')||'<div class="empty">Nada para este día.</div>'}</div>`}
 $('#app').innerHTML=head+body;
 document.querySelectorAll('[data-fl]').forEach(b=>b.onclick=e=>{e.preventDefault();AG.filtro=b.dataset.fl;V.agenda(modo,mes)});
 document.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{AG.dia=b.dataset.dia;V.agenda(modo,mes)})};

  <p class="sub">Si escogés un lote y el tipo es vacunación, desparasitación o pesaje, desde la agenda podés ir directo al registro masivo de ese lote.</p>`;
 $('#ft').onsubmit=async ev=>{ev.preventDefault();const d=formData(ev.target);if(!d.titulo)d.titulo=TT(d.tipo)[2];
  await put('tareas',Object.assign(nueva?{id:uid(),fincaId:S.config.fincaActual,hecha:false,fechaHecha:''}:ta,d));toast('Tarea guardada');go(animalId&&nueva?'#/animal/'+animalId:'#/agenda')};

/* ================= Lectura de aretes (lector Bluetooth en modo teclado, NFC del teléfono o a mano) ================= */
const normA=s=>String(s||'').replace(/[^0-9a-z]/gi,'').toUpperCase();
function buscarArete(code){const n=normA(code);if(!n)return null;const an=animalesF(true);
 const exacto=an.find(a=>[a.chip,a.nfc,a.qr,a.marca,a.codigo].some(v=>v&&normA(v)===n));if(exacto)return exacto;
 if(n.length>=8)return an.find(a=>[a.chip,a.nfc].some(v=>{const m=normA(v);return m.length>=8&&(m.endsWith(n)||n.endsWith(m))}))||null;return null}
const LEER={modo:'buscar',lote:'',leidos:[],ult:{c:'',t:0},nfc:null};
function nfcDisponible(){return'NDEFReader' in window}
async function iniciarNfc(cb){if(!nfcDisponible())return toast('Este teléfono o navegador no tiene NFC web (se necesita Chrome en Android)');
 try{const r=new NDEFReader();const ac=new AbortController();LEER.nfc=ac;await r.scan({signal:ac.signal});toast('NFC activo: acercá el arete a la parte de atrás del teléfono');
  r.onreading=e=>cb(e.serialNumber||'');r.onreadingerror=()=>toast('No se pudo leer ese arete con NFC')}catch(e){toast('NFC: '+(e.message||e))}}
function pararNfc(){if(LEER.nfc){LEER.nfc.abort();LEER.nfc=null}}
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#/leer'))pararNfc()});

V.leer=(modo)=>{LEER.modo=modo==='inventario'?'inventario':'buscar';const inv=LEER.modo==='inventario';
 $('#app').innerHTML=`<h2>📡 Leer arete</h2>
 <div class="row" style="gap:6px;margin-bottom:10px"><a class="btn sm ${inv?'sec':''}" href="#/leer">🔎 Buscar animal</a><a class="btn sm ${inv?'':'sec'}" href="#/leer/inventario">📋 Inventario rápido</a></div>
 ${inv?`<div class="card"><label>Lote o potrero a revisar</label><select id="ilote">${selOpts([['','Toda la finca'],...lotesF().map(l=>[l.id,l.nombre])],LEER.lote)}</select></div>`:''}
 <form class="card" id="flee"><label>Número del arete</label><div class="row"><input id="aret" class="sp" autocomplete="off" placeholder="Pasá el lector o escribí el número" autofocus><button class="btn">${inv?'Agregar':'Buscar'}</button></div>
 <p class="sub" style="margin-bottom:0">Con un <b>lector Bluetooth en modo teclado</b>, el número se escribe solo aquí. Dejá el cursor en esta casilla.</p>
 ${nfcDisponible()?'<button type="button" class="btn sec" id="bnfc" style="margin-top:10px">📱 Leer con el NFC del teléfono</button>':''}</form>
 <div id="lres"></div>`;
 const inp=$('#aret');const foco=()=>setTimeout(()=>inp&&inp.focus(),50);
 const leer=c=>{const n=normA(c);if(!n)return;const ahora=Date.now();if(LEER.ult.c===n&&ahora-LEER.ult.t<2500)return;LEER.ult={c:n,t:ahora};
  if(navigator.vibrate)navigator.vibrate(60);inv?agregarInv(c):mostrarBusqueda(c);inp.value='';foco()};
 $('#flee').onsubmit=e=>{e.preventDefault();leer(inp.value)};
 if($('#bnfc'))$('#bnfc').onclick=()=>iniciarNfc(leer);
 if(inv){$('#ilote').onchange=e=>{LEER.lote=e.target.value;LEER.leidos=[];pintarInv()};pintarInv()}
 foco()};

function mostrarBusqueda(c){const a=buscarArete(c);
 if(a){toast('Encontrado: '+nombreA(a));go('#/animal/'+a.id);return}
 const sin=animalesF().filter(x=>!x.chip).sort((x,y)=>x.codigo.localeCompare(y.codigo,'es',{numeric:true}));
 $('#lres').innerHTML=`<div class="card"><b>El arete ${esc(c)} no está registrado</b><p class="sub">Podés crear el animal con ese arete o asignárselo a uno que ya tengás.</p>
 ${puede('registrar')?`<div class="acts"><a class="btn" href="#/animalform//${encodeURIComponent(c)}">➕ Nuevo animal con este arete</a></div>
 ${sin.length?`<label>Asignar a un animal sin chip</label><div class="row"><select id="asig" class="sp">${selOpts(sin.map(x=>[x.id,nombreA(x)]),'')}</select><button class="btn sec" id="basig">Asignar</button></div>`:''}`:''}</div>`;
 if($('#basig'))$('#basig').onclick=async()=>{const a=animal($('#asig').value);a.chip=c;await put('animales',a);toast('Arete asignado a '+nombreA(a));go('#/animal/'+a.id)}}

function agregarInv(c){const n=normA(c);if(LEER.leidos.some(x=>x.n===n))return toast('Ese arete ya se leyó');const a=buscarArete(c);LEER.leidos.push({n,c,a:a?a.id:null});pintarInv(a?nombreA(a):'Arete desconocido')}
function pintarInv(msg){const esp=animalesF().filter(a=>!LEER.lote||a.loteId===LEER.lote);const ids=new Set(LEER.leidos.map(x=>x.a).filter(Boolean));
 const ok=esp.filter(a=>ids.has(a.id)),falta=esp.filter(a=>!ids.has(a.id)),otros=LEER.leidos.filter(x=>x.a&&!esp.some(a=>a.id===x.a)).map(x=>animal(x.a)),desc=LEER.leidos.filter(x=>!x.a);
 const li=(xs,f)=>xs.length?xs.map(f).join(''):'<div class="sub">—</div>';
 $('#lres').innerHTML=`${msg?`<div class="al ${msg==='Arete desconocido'?'b':'i'}"><div class="t">${esc(msg)}</div></div>`:''}
 <div class="grid"><div class="stat"><div class="v">${ok.length} / ${esp.length}</div><div class="l">Presentes</div></div><div class="stat"><div class="v ${falta.length?'neg':''}">${falta.length}</div><div class="l">Faltan</div></div><div class="stat"><div class="v">${otros.length}</div><div class="l">De otro lote</div></div><div class="stat"><div class="v">${desc.length}</div><div class="l">Desconocidos</div></div></div>
 <div class="card"><b>Faltan (${falta.length})</b><div class="list">${li(falta,a=>`<a class="it" href="#/animal/${a.id}"><div class="sp">${esc(nombreA(a))}<div class="sub">${a.chip?'Arete '+esc(a.chip):'Sin arete registrado'}</div></div></a>`)}</div></div>
 ${otros.length?`<div class="card"><b>De otro lote (${otros.length})</b><div class="list">${li(otros,a=>`<div class="it"><div class="sp">${esc(nombreA(a))}<div class="sub">Está en: ${esc(loteN(a.loteId))}</div></div></div>`)}</div>${LEER.lote&&puede('registrar')?`<button class="btn sec sm" id="mover">🔀 Pasarlos a ${esc(loteN(LEER.lote))}</button>`:''}</div>`:''}
 ${desc.length?`<div class="card"><b>Aretes desconocidos (${desc.length})</b><div class="list">${li(desc,x=>`<div class="it"><div class="sp">${esc(x.c)}</div>${puede('registrar')?`<a class="btn sm sec" href="#/animalform//${encodeURIComponent(x.c)}">➕ Crear</a>`:''}</div>`)}</div></div>`:''}
 <div class="card"><b>Presentes (${ok.length})</b><div class="list">${li(ok,a=>`<div class="it"><div class="sp">✅ ${esc(nombreA(a))}</div></div>`)}</div></div>
 ${LEER.leidos.length?'<button class="btn sec sm" id="reini">Empezar de nuevo</button>':''}`;
 if($('#mover'))$('#mover').onclick=async()=>{for(const a of otros)await registrar(a,'lote',hoy(),{destino:LEER.lote},'Inventario con lector');toast(otros.length===1?'1 animal movido':otros.length+' animales movidos');pintarInv()};
 if($('#reini'))$('#reini').onclick=()=>{LEER.leidos=[];pintarInv()}}

 <form class="card" id="feq"><b>Agregar trabajador</b><div class="f2"><div><label>Correo de su cuenta</label><input name="email" type="email" required placeholder="trabajador@correo.com"></div>
 <div><label>Rol</label><select name="rol">${selOpts(Object.entries(ROLES).filter(([k])=>k!=='propietario').map(([k,v])=>[k,v]),'peon')}</select></div></div>
 <div class="row" style="margin-top:12px"><button class="btn">Agregar</button></div></form>
 <div class="card"><b>¿Cómo se crea la cuenta del trabajador?</b><ol class="sub" style="padding-left:18px;margin:8px 0 0">
 <li>En Supabase: <b>Authentication → Users → Add user → Create new user</b>.</li><li>Escribí su correo y una contraseña, y marcá <b>Auto Confirm User</b>.</li>
 <li>Aquí lo agregás con ese correo y su rol.</li><li>El trabajador abre <b>${esc(location.host||'la app')}</b> en su teléfono y entra con ese correo y contraseña.</li></ol></div>
 <div class="card"><b>Qué puede hacer cada rol</b><dl class="kv" style="margin-top:8px">${Object.entries(ROL_TXT).map(([k,v])=>`<dt>${ROLES[k]}</dt><dd class="sub">${v}</dd>`).join('')}</dl></div>`;
 const sb=N.userId&&navigator.onLine?await Sync.cliente():null;
 if(!sb){$('#eq').innerHTML='<div class="empty">Necesitás internet y haber iniciado sesión en la nube.</div>';return}
 const carga=async()=>{const {data,error}=await sb.from('miembros').select('user_id,email,rol').eq('finca_id',f.id).order('email');
  if(error){$('#eq').innerHTML=`<p class="tag w">${/schema cache|does not exist|PGRST205|42P01/i.test(error.message)?'Falta ejecutar el script 04-trabajadores.sql en Supabase.':esc(error.message)}</p>`;return}
  $('#eq').innerHTML=`<b>Equipo de la finca</b><div class="list"><div class="it"><div class="av">👑</div><div class="sp"><b>${esc(N.email)}</b><div class="sub">Propietario (vos)</div></div></div>${data.map(m=>`<div class="it"><div class="av">👤</div><div class="sp"><b>${esc(m.email||m.user_id)}</b><select data-rol="${m.user_id}" style="margin-top:4px">${selOpts(Object.entries(ROLES).filter(([k])=>k!=='propietario'),m.rol)}</select></div><button class="btn sm bad" data-quitar="${m.user_id}" title="Quitar">✕</button></div>`).join('')}</div>${data.length?'':'<p class="sub">Todavía no hay trabajadores.</p>'}`;
  document.querySelectorAll('[data-rol]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('miembros').update({rol:s.value}).eq('finca_id',f.id).eq('user_id',s.dataset.rol);toast(error?'Error: '+error.message:'Rol actualizado')});
  document.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Quitar a este trabajador de la finca? Ya no podrá ver ni registrar nada.'))return;const {error}=await sb.from('miembros').delete().eq('finca_id',f.id).eq('user_id',b.dataset.quitar);toast(error?'Error: '+error.message:'Trabajador quitado');carga()})};
 $('#feq').onsubmit=async e=>{e.preventDefault();const d=formData(e.target);const {error}=await sb.rpc('mg_agregar_miembro',{p_finca:f.id,p_email:d.email,p_rol:d.rol});
  if(error)return toast(/function|schema cache|PGRST202/i.test(error.message)&&!/propietario|cuenta/i.test(error.message)?'Falta ejecutar el script 04-trabajadores.sql en Supabase':error.message);toast('Trabajador agregado');e.target.reset();carga()};
 carga()};

function route(){const h=location.hash.replace(/^#\/?/,'')||'inicio';const [r,...p]=h.split('/');
 setFincas();Sync.pinta();
 if(Sync.necesitaLogin&&r!=='nube'){return V.login()}
 if(r==='nube'){setNav('mas');$('#ttl').textContent='Nube';return V.nube()}
 if(!F()&&r!=='finca'){return V.bienvenida()}
 const bloq={finanzas:'finanzas',mov:'finanzas',masivo:'registrar',evento:'registrar',animalform:'registrar',tarea:'registrar',param:'finca',equipo:'equipo'}[r]||(r==='finca'&&p[0]!=='nueva'?'finca':null);
 if(bloq&&F()&&!puede(bloq)){toast('Tu rol no permite entrar ahí');location.hash='#/inicio';return}
 const fn=V[r]||V.inicio;setNav({animal:'animales',animalform:'animales',evento:'animales',mov:'finanzas',archivo:'animales',tarea:'agenda',leer:'animales',equipo:'mas'}[r]||r);$('#ttl').textContent=F()?F().nombre:'Mi Ganado';fn(...p.map(decodeURIComponent));window.scrollTo(0,0)}
window.onhashchange=route;
const go=h=>location.hash=h;
function selOpts(arr,val,vacia){return(vacia?`<option value="">${vacia}</option>`:'')+arr.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`}).join('')}
function formData(f){const o={};new FormData(f).forEach((v,k)=>o[k]=typeof v==='string'?v.trim():v);return o}

V.bienvenida=()=>{setNav('');$('#ttl').textContent='Mi Ganado';$('#app').innerHTML=`<div class="card"><h2>¡Bienvenido! 🐄</h2><p>Para comenzar, crea tu finca. Toda la información se guarda en este dispositivo y funciona sin internet.</p><a class="btn" href="#/finca/nueva">Crear mi finca</a></div><div class="card"><p class="muted" style="margin:0">¿Tienes un respaldo? Puedes restaurarlo:</p><label>Archivo de respaldo (.json)</label><input type="file" accept=".json" id="imp"></div><div class="card"><b>☁️ Guardar en la nube</b><p class="sub">Conecta tu proyecto de Supabase para respaldar y sincronizar tus datos.</p><a class="btn sec" href="#/nube">Conectar con Supabase</a></div>`;$('#imp').onchange=importar};

V.inicio=()=>{const an=animalesF(),t=hoy();const H=an.filter(a=>a.sexo==='H'),M=an.filter(a=>a.sexo==='M');
 const reps=H.map(a=>repro(a));const ord=reps.filter(r=>r.lactando).length,pre=reps.filter(r=>r.estado==='Preñada').length;
 const lech=S.eventos.filter(e=>e.tipo==='leche'&&an.some(a=>a.id===e.animalId));
 const dia=[];for(let i=13;i>=0;i--){const f=addDias(t,-i);dia.push({f,v:lech.filter(e=>e.fecha===f).reduce((s,e)=>s+litros(e),0)})}
 const mx=Math.max(1,...dia.map(d=>d.v));const ult=dia.filter(d=>d.v>0).pop();
 const porEt={};an.forEach(a=>{const k=ETAPAS[etapa(a).i];porEt[k]=(porEt[k]||0)+1});
 const al=alertas();
 $('#app').innerHTML=`<div class="grid">
  <div class="stat"><div class="v">${an.length}</div><div class="l">Animales activos</div></div>
  <div class="stat"><div class="v">${H.length} / ${M.length}</div><div class="l">Hembras / machos</div></div>
  <div class="stat"><div class="v">${ord}</div><div class="l">En ordeño</div></div>
  <div class="stat"><div class="v">${pre}</div><div class="l">Preñadas</div></div>
  <div class="stat"><div class="v">${ult?num(ult.v):'—'}</div><div class="l">Litros ${ult?'('+fmtF(ult.f)+')':'último día'}</div></div>
  <div class="stat"><div class="v">${al.length}</div><div class="l">Alertas</div></div></div>
 ${agendaCard()}
 <div class="card"><div class="row"><b>Producción de leche · 14 días</b><span class="sp"></span><a class="btn sm sec" href="#/masivo/leche">Registrar</a></div>
  <div class="bars" style="margin-bottom:20px">${dia.map(d=>`<div title="${fmtF(d.f)}: ${num(d.v)} L" style="height:${d.v/mx*100}%"><span>${D(d.f).getDate()}</span></div>`).join('')}</div></div>
 ${puede('finanzas')?finResumenCard():''}
 <div class="card"><b>Animales por etapa</b><div style="margin-top:8px">${Object.keys(porEt).length?ETAPAS.filter(k=>porEt[k]).map(k=>`<span class="tag g">${k}: ${porEt[k]}</span>`).join(''):'<span class="muted">Aún no hay animales.</span>'}</div></div>
 <div class="card"><div class="row"><b>Alertas principales</b><span class="sp"></span><a href="#/alertas" class="btn sm sec">Ver todas</a></div><div style="margin-top:10px">${al.length?al.slice(0,5).map(alHtml).join(''):'<div class="muted">Sin alertas pendientes. 👌</div>'}</div></div>
 <div class="acts">${puede('registrar')?'<a class="btn" href="#/animalform">➕ Nuevo animal</a><a class="btn sec" href="#/masivo/leche">🥛 Leche</a><a class="btn sec" href="#/masivo/peso">⚖️ Pesaje</a>':''}<a class="btn sec" href="#/leer">📡 Leer arete</a><a class="btn sec" href="#/informes">📊 Informes</a></div>`};
const alHtml=x=>`<a class="al ${x.cls}" href="#/animal/${x.a.id}"><div><div class="t">${esc(x.t)} · ${esc(nombreA(x.a))}</div><div class="sub">${esc(x.d)}</div></div></a>`;

let filtro={q:'',sexo:'',lote:'',etapa:'',estado:'activo'};
V.animales=()=>{const ls=lotesF();
 $('#app').innerHTML=`<div class="row"><h2 class="sp">Animales</h2><a class="btn sec" href="#/leer">📡 Leer arete</a>${puede('registrar')?'<a class="btn" href="#/animalform">➕ Nuevo</a>':''}</div>
 <div class="card"><input id="q" placeholder="Buscar por código, nombre, chip…" value="${esc(filtro.q)}">
 <div class="f2"><div><label>Sexo</label><select id="fs">${selOpts([['','Todos'],['H','Hembras'],['M','Machos']],filtro.sexo)}</select></div>
 <div><label>Lote / potrero</label><select id="fl">${selOpts([['','Todos'],...ls.map(l=>[l.id,l.nombre])],filtro.lote)}</select></div>
 <div><label>Etapa</label><select id="fe">${selOpts([['','Todas'],...ETAPAS.map((e,i)=>[i,e])],filtro.etapa)}</select></div>
 <div><label>Estado</label><select id="fx">${selOpts([['activo','En la finca'],['vendido','Vendidos'],['muerto','Muertos'],['todos','Todos']],filtro.estado)}</select></div></div></div>
 <div class="card list" id="lst"></div>`;
 const pinta=()=>{const q=filtro.q.toLowerCase();let an=animalesF(true).filter(a=>filtro.estado==='todos'||a.estado===filtro.estado);
  an=an.filter(a=>(!filtro.sexo||a.sexo===filtro.sexo)&&(!filtro.lote||a.loteId===filtro.lote)&&(filtro.etapa===''||etapa(a).i==filtro.etapa)&&(!q||[a.codigo,a.nombre,a.chip,a.nfc,a.qr,a.raza].some(v=>(v||'').toLowerCase().includes(q))));
  an.sort((x,y)=>x.codigo.localeCompare(y.codigo,'es',{numeric:true}));
  $('#lst').innerHTML=an.length?`<div class="sub" style="margin-bottom:4px">${an.length} animales</div>`+an.map(a=>{const r=repro(a),et=etapa(a),s=salud(a);return`<a class="it" href="#/animal/${a.id}">${avHtml(a)}<div class="sp"><b>${esc(a.codigo)}</b> ${esc(a.nombre||'')}<div class="sub">${et.n} · ${esc(a.raza||'Sin raza')} · ${esc(loteN(a.loteId))}</div><div>${a.estado!=='activo'?`<span class="tag g">${a.estado}</span>`:''}${r.estado==='Preñada'?'<span class="tag">Preñada</span>':r.estado==='Servida'?'<span class="tag i">Servida</span>':''}${r.lactando?'<span class="tag i">En ordeño</span>':''}${s.map(x=>`<span class="tag ${x.k==='mast'?'b':'w'}">${esc(x.txt)}</span>`).join('')}</div></div></a>`}).join(''):'<div class="empty">No hay animales con ese filtro.</div>'};
 $('#q').oninput=e=>{filtro.q=e.target.value;pinta()};
 [['#fs','sexo'],['#fl','lote'],['#fe','etapa'],['#fx','estado']].forEach(([s,k])=>$(s).onchange=e=>{filtro[k]=e.target.value;pinta();hidratar(true)});pinta();hidratar(true)};

V.animalform=(id,chipIni)=>{const a=id?animal(id):{especie:F().especie||'bovino',sexo:'H',estado:'activo',proposito:F().proposito,chip:chipIni||''};const ls=lotesF();
 const madres=animalesF(true).filter(x=>x.sexo==='H'&&x.id!==a.id),padres=animalesF(true).filter(x=>x.sexo==='M'&&x.id!==a.id);
 $('#app').innerHTML=`<h2>${id?'Editar animal':'Nuevo animal'}</h2><form class="card" id="fa">
 <div class="f2"><div><label>Código / número *</label><input name="codigo" required value="${esc(a.codigo)}"></div><div><label>Nombre</label><input name="nombre" value="${esc(a.nombre)}"></div>
 <div><label>Especie</label><select name="especie">${selOpts(Object.entries(ESPECIES).map(([k,v])=>[k,v.n]),a.especie)}</select></div>
 <div><label>Sexo</label><select name="sexo">${selOpts([['H','Hembra'],['M','Macho']],a.sexo)}</select></div>
 <div><label>Fecha de nacimiento</label><input type="date" name="fechaNac" value="${esc(a.fechaNac)}" max="${hoy()}"></div>
 <div><label>Raza</label><input name="raza" list="rz" value="${esc(a.raza)}"><datalist id="rz">${RAZAS.map(r=>`<option value="${r}">`).join('')}</datalist></div>
 <div><label>Propósito</label><select name="proposito">${selOpts(PROPOSITOS,a.proposito,'—')}</select></div>
 <div><label>Lote / potrero</label><select name="loteId">${selOpts(ls.map(l=>[l.id,l.nombre]),a.loteId,'Sin asignar')}</select></div>
 <div><label>Madre</label><select name="madreId">${selOpts(madres.map(m=>[m.id,nombreA(m)]),a.madreId,'Desconocida / externa')}</select></div>
 <div><label>Padre (animal de la finca)</label><select name="padreId">${selOpts(padres.map(m=>[m.id,nombreA(m)]),a.padreId,'—')}</select></div>
 <div><label>Padre / pajilla (externo)</label><input name="padreTxt" value="${esc(a.padreTxt)}"></div>
 <div><label>Dieta</label><select name="dieta">${selOpts(DIETAS,a.dieta,'—')}</select></div>
 <div><label>Origen</label><select name="origen">${selOpts(['Nacido en la finca','Comprado'],a.origen,'—')}</select></div>
 <div><label>Fecha de ingreso / compra</label><input type="date" name="fechaIngreso" value="${esc(a.fechaIngreso)}"></div>
 ${id||!puede('finanzas')?'':`<div><label>Precio de compra (opcional)</label><input type="number" step="any" min="0" name="precioCompra" placeholder="Se anota como gasto"></div><div><label>Vendedor (opcional)</label><input name="vendedor"></div>`}</div>
 <h3>Identificación</h3><div class="f2"><div><label>Chip RFID</label><input name="chip" value="${esc(a.chip)}"></div><div><label>Tag NFC</label><input name="nfc" value="${esc(a.nfc)}"></div><div><label>Código QR / barras</label><input name="qr" value="${esc(a.qr)}"></div><div><label>Marca / hierro / arete</label><input name="marca" value="${esc(a.marca)}"></div></div>
 ${id?'':`<h3>Datos iniciales (opcional)</h3><div class="f2"><div><label>Peso actual (kg)</label><input type="number" step="any" name="pesoIni"></div><div><label>Estado reproductivo</label><select name="reproIni">${selOpts([['','—'],['prenada','Preñada'],['lactando','En ordeño']],'')}</select></div><div><label>Fecha del último parto</label><input type="date" name="partoIni"></div><div><label>Fecha del último servicio</label><input type="date" name="servIni"></div></div>`}
 <label>Notas</label><textarea name="notas" rows="2">${esc(a.notas)}</textarea>
 <div class="row" style="margin-top:14px"><button class="btn">Guardar</button><a class="btn sec" href="${id?'#/animal/'+id:'#/animales'}">Cancelar</a></div></form>`;
 $('#fa').onsubmit=async ev=>{ev.preventDefault();const d=formData(ev.target);
  const dup=S.animales.find(x=>x.fincaId===S.config.fincaActual&&x.id!==a.id&&x.codigo.toLowerCase()===d.codigo.toLowerCase());if(dup)return toast('Ya existe un animal con ese código');
  for(const k of['chip','nfc','qr'])if(d[k]&&S.animales.some(x=>x.id!==a.id&&x[k]===d[k]))return toast('Ese código de '+k.toUpperCase()+' ya está en otro animal');
  const {pesoIni,reproIni,partoIni,servIni,precioCompra,vendedor,...rest}=d;const obj=Object.assign({},a,rest,{id:a.id||uid(),fincaId:a.fincaId||S.config.fincaActual,estado:a.estado||'activo'});
  await put('animales',obj);const f=hoy();
  if(!id){if(pesoIni)await put('eventos',{id:uid(),animalId:obj.id,fincaId:obj.fincaId,tipo:'peso',fecha:f,datos:{valor:Number(pesoIni)},notas:'Peso inicial'});
   if(obj.sexo==='H'){if(partoIni)await put('eventos',{id:uid(),animalId:obj.id,fincaId:obj.fincaId,tipo:'parto',fecha:partoIni,datos:{sexoCria:'Sin cría viva'},notas:'Registro inicial'});
    if(reproIni==='lactando'&&!partoIni)await put('eventos',{id:uid(),animalId:obj.id,fincaId:obj.fincaId,tipo:'parto',fecha:f,datos:{sexoCria:'Sin cría viva'},notas:'Registro inicial (fecha desconocida)'});
    if(servIni)await put('eventos',{id:uid(),animalId:obj.id,fincaId:obj.fincaId,tipo:'servicio',fecha:servIni,datos:{metodo:'Monta natural'},notas:'Registro inicial'});
    if(reproIni==='prenada')await put('eventos',{id:uid(),animalId:obj.id,fincaId:obj.fincaId,tipo:'chequeo',fecha:f,datos:{resultado:'Preñada'},notas:'Registro inicial'});}}
  if(!id&&Number(precioCompra)>0)await put('movimientos',{id:uid(),fincaId:obj.fincaId,tipo:'gasto',categoria:'Compra de ganado',fecha:obj.fechaIngreso||f,monto:Number(precioCompra),cantidad:1,unidad:'animal',descripcion:'Compra de '+nombreA(obj),tercero:vendedor||'',animalId:obj.id,loteId:obj.loteId||''});
  toast('Animal guardado');go('#/animal/'+obj.id)}};

V.animal=(id,tab='general')=>{const a=animal(id);if(!a)return go('#/animales');const r=repro(a),et=etapa(a),s=salud(a),ev=evDe(id),pk=ultPeso(a);
 const hijos=S.animales.filter(x=>x.madreId===id||x.padreId===id);const T=(k,l)=>`<a href="#/animal/${id}/${k}" class="${tab===k?'on':''}">${l}</a>`;
 let body='';
 if(tab==='general')body=`<div class="card"><dl class="kv"><dt>Especie</dt><dd>${ESPECIES[a.especie]?.n||'—'}</dd><dt>Sexo</dt><dd>${a.sexo==='H'?'Hembra':'Macho'}</dd><dt>Etapa</dt><dd>${et.n}</dd><dt>Nacimiento</dt><dd>${fmtF(a.fechaNac)} (${edadTxt(a.fechaNac)})</dd><dt>Raza</dt><dd>${esc(a.raza||'—')}</dd><dt>Propósito</dt><dd>${esc(a.proposito||'—')}</dd><dt>Lote</dt><dd>${esc(loteN(a.loteId))}</dd><dt>Madre</dt><dd>${a.madreId?`<a href="#/animal/${a.madreId}">${esc(nombreA(animal(a.madreId)))}</a>`:'—'}</dd><dt>Padre</dt><dd>${a.padreId?`<a href="#/animal/${a.padreId}">${esc(nombreA(animal(a.padreId)))}</a>`:esc(a.padreTxt||'—')}</dd><dt>Dieta</dt><dd>${esc(a.dieta||'—')}</dd><dt>Origen</dt><dd>${esc(a.origen||'—')}${a.fechaIngreso?' · '+fmtF(a.fechaIngreso):''}</dd><dt>Chip / NFC / QR</dt><dd>${esc([a.chip,a.nfc,a.qr].filter(Boolean).join(' · ')||'—')}</dd><dt>Marca</dt><dd>${esc(a.marca||'—')}</dd><dt>Último peso</dt><dd>${pk?num(pk.kg)+' kg ('+fmtF(pk.fecha)+')':'—'}</dd></dl>${a.notas?`<p class="sub">${esc(a.notas)}</p>`:''}</div>
  ${hijos.length?`<div class="card"><b>Crías (${hijos.length})</b><div class="list">${hijos.map(h=>`<a class="it" href="#/animal/${h.id}"><div class="av ${h.sexo}">${h.sexo}</div><div>${esc(nombreA(h))}<div class="sub">${fmtF(h.fechaNac)}</div></div></a>`).join('')}</div></div>`:''}`;
 if(tab==='repro')body=a.sexo!=='H'?`<div class="card"><p>Hijos registrados: ${hijos.length}</p></div>`:`<div class="card"><dl class="kv"><dt>Estado</dt><dd>${r.estado}</dd><dt>Partos</dt><dd>${r.partos}</dd><dt>Último parto</dt><dd>${fmtF(r.ultParto)}</dd><dt>Último servicio</dt><dd>${fmtF(r.ultServ)}</dd><dt>Parto estimado</dt><dd>${r.partoEsp?fmtF(r.partoEsp)+' ('+dias(hoy(),r.partoEsp)+' días)':'—'}</dd><dt>Días abiertos</dt><dd>${r.diasAbiertos??'—'}</dd><dt>Intervalo entre partos</dt><dd>${intervaloPartos(a)}</dd></dl></div>`+histHtml(ev.filter(e=>['celo','servicio','chequeo','parto','aborto','secado'].includes(e.tipo)));

 reproduccion:{n:'Reproducción (hembras)',f:()=>[['Código','Nombre','Estado','Partos','Último parto','Último servicio','Parto estimado','Días abiertos','En ordeño','Días lactancia'],animalesF().filter(a=>a.sexo==='H'&&etapa(a).i>=2).map(a=>{const r=repro(a);return[a.codigo,a.nombre||'',r.estado,r.partos,r.ultParto||'',r.ultServ||'',r.partoEsp||'',r.diasAbiertos??'',r.lactando?'Sí':'No',r.diasLact??'']})]},
 lechedia:{n:'Leche por día (60 días)',f:()=>{const ids=new Set(animalesF(true).map(a=>a.id)),m={};S.eventos.filter(e=>e.tipo==='leche'&&ids.has(e.animalId)&&dias(e.fecha,hoy())<=60).forEach(e=>{const x=m[e.fecha]=m[e.fecha]||{l:0,n:0,ma:0,ta:0};x.l+=litros(e);x.n++;x.ma+=Number(e.datos.manana)||0;x.ta+=Number(e.datos.tarde)||0});return[['Fecha','Mañana (L)','Tarde (L)','Total (L)','Vacas','Promedio por vaca'],Object.keys(m).sort().reverse().map(f=>[f,m[f].ma,m[f].ta,m[f].l,m[f].n,+(m[f].l/m[f].n).toFixed(2)])]}},
 lechevaca:{n:'Leche por vaca (30 días)',f:()=>[['Código','Nombre','Días lactancia','Registros','Total (L)','Promedio L/día','Máximo'],animalesF(true).filter(a=>a.sexo==='H').map(a=>{const l=evDe(a.id).filter(e=>e.tipo==='leche'&&dias(e.fecha,hoy())<=30).map(litros);return l.length?[a.codigo,a.nombre||'',repro(a).diasLact??'',l.length,+l.reduce((s,v)=>s+v,0).toFixed(1),+(l.reduce((s,v)=>s+v,0)/l.length).toFixed(2),Math.max(...l)]:null}).filter(Boolean)]},
 pesos:{n:'Pesajes y ganancia',f:()=>{const rows=[];animalesF(true).forEach(a=>{const p=evDe(a.id).filter(e=>e.tipo==='peso');p.forEach((e,i)=>{const pr=p[i-1];const d=pr?dias(pr.fecha,e.fecha):0;rows.push([a.codigo,a.nombre||'',e.fecha,e.datos.valor,pr?+(e.datos.valor-pr.datos.valor).toFixed(1):'',pr&&d>0?Math.round((e.datos.valor-pr.datos.valor)/d*1000):''])})});return[['Código','Nombre','Fecha','Peso (kg)','Diferencia (kg)','Ganancia diaria (g)'],rows.sort((x,y)=>y[2].localeCompare(x[2]))]}},
 sanidad:{n:'Sanidad',f:()=>{const ids=new Set(animalesF(true).map(a=>a.id));return[['Fecha','Animal','Tipo','Detalle','Notas'],S.eventos.filter(e=>ids.has(e.animalId)&&['vacuna','desparasitacion','tratamiento','mastitis'].includes(e.tipo)).sort((x,y)=>y.fecha.localeCompare(x.fecha)).map(e=>[e.fecha,nombreA(animal(e.animalId)),TIPOS[e.tipo].n,evTxt(e),e.notas||''])]}},
 finmes:{n:'Finanzas por mes',f:()=>{const m={};movF().forEach(x=>{const k=x.fecha.slice(0,7);const r=m[k]=m[k]||{i:0,g:0};r[x.tipo==='ingreso'?'i':'g']+=x.monto});return[['Mes','Ingresos','Gastos','Ganancia'],Object.keys(m).sort().reverse().map(k=>[k,m[k].i,m[k].g,m[k].i-m[k].g])]}},
 movs:{n:'Movimientos (ingresos y gastos)',f:()=>[['Fecha','Tipo','Categoría','Descripción','Cantidad','Unidad','Precio unitario','Monto','Proveedor / cliente','Lote','Animal'],movF().sort((x,y)=>y.fecha.localeCompare(x.fecha)).map(x=>[x.fecha,x.tipo==='ingreso'?'Ingreso':'Gasto',x.categoria,x.descripcion||'',x.cantidad===''?'':x.cantidad,x.unidad||'',x.precioUnit===''?'':x.precioUnit,x.tipo==='gasto'?-x.monto:x.monto,x.tercero||'',x.loteId?loteN(x.loteId):'',x.animalId?nombreA(animal(x.animalId)):''])]},
 bajas:{n:'Ventas y muertes',f:()=>{const ids=new Set(animalesF(true).map(a=>a.id));return[['Fecha','Animal','Tipo','Detalle'],S.eventos.filter(e=>ids.has(e.animalId)&&(e.tipo==='venta'||e.tipo==='muerte')).sort((x,y)=>y.fecha.localeCompare(x.fecha)).map(e=>[e.fecha,nombreA(animal(e.animalId)),TIPOS[e.tipo].n,evTxt(e)])]}}
};

 const [c,rows]=INF[k].f();$('#app').innerHTML=`<div class="row"><h2 class="sp">${INF[k].n}</h2><button class="btn sm" id="csv">⬇️ Excel (CSV)</button></div><div class="card tw">${rows.length?`<table><thead><tr>${c.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(typeof x==='number'?num(x,2):x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Sin datos.</div>'}</div><p class="sub">${rows.length} filas · ${esc(F().nombre)} · ${fmtF(hoy())}</p><a class="btn sec sm" href="#/informes">← Informes</a>`;
 $('#csv').onclick=()=>{const q=v=>{v=v==null?'':String(v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const txt='sep=;\n'+[c,...rows].map(r=>r.map(x=>typeof x==='number'?String(x).replace('.',','):q(x)).join(';')).join('\n');descargar('\ufeff'+txt,`${k}-${hoy()}.csv`,'text/csv')}};
function descargar(txt,nombre,tipo){const b=new Blob([txt],{type:tipo});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=nombre;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}

V.respaldo=()=>{$('#app').innerHTML=`<h2>Respaldo de datos</h2><div class="card"><p>Los datos viven solo en este navegador. Si se borra el historial del navegador o cambias de teléfono, se pierden. <b>Descarga un respaldo cada semana</b> y guárdalo en Drive o en tu computadora.</p><p class="sub">El respaldo incluye todos los registros y finanzas; las fotos y documentos quedan guardados en la nube.</p><button class="btn" id="exp">⬇️ Descargar respaldo</button></div><div class="card" ${rol()==='propietario'?'':'hidden'}><b>Restaurar respaldo</b><p class="sub">Reemplaza todos los datos actuales por los del archivo.</p><input type="file" accept=".json" id="imp"></div>`;
 $('#exp').onclick=()=>{descargar(JSON.stringify({app:'mi-ganado',v:1,fecha:new Date().toISOString(),datos:{fincas:S.fincas,lotes:S.lotes,animales:S.animales,eventos:S.eventos,archivos:S.archivos,movimientos:S.movimientos,tareas:S.tareas,config:S.config}},null,1),`respaldo-mi-ganado-${hoy()}.json`,'application/json');S.config.ultimoRespaldo=hoy();saveCfg()};$('#imp').onchange=importar};
async function importar(ev){const file=ev.target.files[0];if(!file)return;try{const j=JSON.parse(await file.text());if(j.app!=='mi-ganado')throw 0;if(S.fincas.length&&!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?'))return;
 for(const s of STORES)await tx(s,'readwrite',o=>o.clear());await saveN();for(const s of DATA)for(const r of j.datos[s]||[]){r._s=0;r.mod=r.mod||Date.now();await tx(s,'readwrite',o=>o.put(r))}S.config=Object.assign({},CFG0,j.datos.config||{});delete S.config.id;await saveCfg();await loadAll();toast('Respaldo restaurado');go('#/inicio');route()}catch(e){toast('Archivo de respaldo no válido')}}

/* ================= Fotos y documentos ================= */
const ARCH_TIPOS=[['foto','📷 Foto'],['cert_vacunacion','💉 Certificado de vacunación'],['cert_registro','📜 Registro / raza pura'],['cert_sanitario','🩺 Certificado sanitario'],['cert_propiedad','🏷️ Certificado de propiedad'],['guia','🚚 Guía de movilización'],['otro','📄 Otro documento']];
const archTipoN=t=>(ARCH_TIPOS.find(x=>x[0]===t)||[0,'📄 Documento'])[1];
const URLS={};
const extDe=m=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'}[m]||'bin');
const tamTxt=b=>!b?'':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';
function portadaDe(a){const f=S.archivos.filter(x=>x.animalId===a.id&&x.tipo==='foto');return f.find(x=>x.portada)||f.sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''))[0]}
function avHtml(a,size){const f=portadaDe(a);const st=size?` style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px"`:'';return`<div class="av ${a.sexo}"${st}${f?` data-av="${f.id}"`:''}>${a.sexo}</div>`}
async function urlArchivo(ar,soloLocal){if(URLS[ar.id])return URLS[ar.id];
 const b=await tx('blobs','readonly',o=>o.get(ar.id));if(b&&b.blob){URLS[ar.id]=URL.createObjectURL(b.blob);return URLS[ar.id]}
 if(soloLocal||!ar.ruta||!N.userId||!navigator.onLine)return null;
 try{const sb=await Sync.cliente();if(!sb)return null;const {data,error}=await sb.storage.from('archivos').download(ar.ruta);if(error||!data)return null;
  await tx('blobs','readwrite',o=>o.put({id:ar.id,blob:data,subido:true}));URLS[ar.id]=URL.createObjectURL(data);return URLS[ar.id]}catch(e){return null}}
function hidratar(soloLocal){document.querySelectorAll('[data-av],[data-ph]').forEach(async el=>{const id=el.dataset.av||el.dataset.ph;const ar=S.archivos.find(x=>x.id===id);if(!ar)return;
 const u=await urlArchivo(ar,soloLocal&&!!el.dataset.av);if(u){el.style.backgroundImage=`url("${u}")`;if(el.dataset.av)el.classList.add('img')}})}
async function borrarBlob(id){await tx('blobs','readwrite',o=>o.delete(id));if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id]}}
async function comprimir(file){if(!file.type.startsWith('image/'))return file;
 try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const out=await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',0.8));return out&&out.size<file.size?out:file}catch(e){return file}}
async function guardarArchivo(a,file,meta){const blob=await comprimir(file);
 if(blob.size>10*1024*1024){toast('El archivo pesa más de 10 MB');return false}
 const id=uid();await tx('blobs','readwrite',o=>o.put({id,blob,subido:false}));
 const primera=meta.tipo==='foto'&&!S.archivos.some(x=>x.animalId===a.id&&x.tipo==='foto');
 await put('archivos',{id,fincaId:a.fincaId,animalId:a.id,tipo:meta.tipo,nombre:meta.nombre||file.name||'archivo',mime:blob.type||file.type||'application/octet-stream',tamano:blob.size,fecha:meta.fecha||hoy(),notas:meta.notas||'',portada:primera,ruta:''});return true}
async function subirArchivos(sb){if(!N.userId)return;const pend=(await tx('blobs','readonly',o=>o.getAll())).filter(b=>!b.subido);
 for(const b of pend){const ar=S.archivos.find(x=>x.id===b.id);if(!ar){await tx('blobs','readwrite',o=>o.delete(b.id));continue}
  const ruta=`${N.userId}/${ar.id}.${extDe(ar.mime)}`;const {error}=await sb.storage.from('archivos').upload(ruta,b.blob,{contentType:ar.mime,upsert:true});
  if(error)throw new Error('archivo: '+error.message);b.subido=true;await tx('blobs','readwrite',o=>o.put(b));
  if(ar.ruta!==ruta){ar.ruta=ruta;ar.mod=Date.now();ar._s=0;await putRaw('archivos',ar)}}}
function archivosHtml(a){const mios=S.archivos.filter(x=>x.animalId===a.id).sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));const fotos=mios.filter(x=>x.tipo==='foto'),docs=mios.filter(x=>x.tipo!=='foto');
 return`<div class="card"><div class="acts" ${puede('registrar')?'':'hidden'}><label class="btn sm upl">📷 Tomar foto<input type="file" accept="image/*" capture="environment" data-up="foto"></label><label class="btn sec sm upl">🖼️ De la galería<input type="file" accept="image/*" multiple data-up="foto"></label><label class="btn sec sm upl">📄 Documento<input type="file" accept="image/*,application/pdf" data-up="doc"></label></div><div id="docform"></div>
 ${N.userId?'':'<p class="sub">Sin sesión en la nube: las fotos quedan solo en este dispositivo.</p>'}</div>
 <div class="card"><b>Fotos (${fotos.length})</b>${fotos.length?`<div class="fotos" style="margin-top:8px">${fotos.map(f=>`<button class="ph" data-ph="${f.id}" data-ver="${f.id}" title="${esc(fmtF(f.fecha))}">${f.portada?'<b>⭐</b>':''}</button>`).join('')}</div>`:'<div class="empty">Aún no hay fotos. La primera será la foto de perfil.</div>'}</div>
 <div class="card"><b>Documentos (${docs.length})</b><div class="list">${docs.map(d=>`<div class="it"><div class="av">${d.mime==='application/pdf'?'📄':'🖼️'}</div><div class="sp"><b>${esc(d.nombre)}</b><div class="sub">${esc(archTipoN(d.tipo))} · ${fmtF(d.fecha)} · ${tamTxt(d.tamano)}${d.notas?' · '+esc(d.notas):''}</div></div><button class="btn sm sec" data-abrir="${d.id}">Abrir</button>${puede('borrar')?`<button class="btn sm sec" data-delar="${d.id}" title="Eliminar">✕</button>`:''}</div>`).join('')||'<div class="empty">Sin documentos. Sube certificados de vacunación, registro, guías…</div>'}</div></div>`}
function archivosEventos(a){
 document.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=async()=>{const files=[...inp.files];inp.value='';if(!files.length)return;
  if(inp.dataset.up==='foto'){let n=0;for(const f of files)if(await guardarArchivo(a,f,{tipo:'foto',nombre:f.name}))n++;if(n)toast(n===1?'Foto guardada':n+' fotos guardadas');route();return}
  const file=files[0];if(file.size>25*1024*1024)return toast('El archivo es demasiado grande (máx. 10 MB)');
  $('#docform').innerHTML=`<form id="fdoc" style="margin-top:12px"><div class="f2"><div><label>Tipo de documento</label><select name="tipo">${selOpts(ARCH_TIPOS.filter(x=>x[0]!=='foto'),'cert_vacunacion')}</select></div><div><label>Nombre</label><input name="nombre" value="${esc(file.name.replace(/\.[^.]+$/,''))}"></div><div><label>Fecha del documento</label><input type="date" name="fecha" value="${hoy()}"></div><div><label>Notas</label><input name="notas"></div></div><div class="row" style="margin-top:10px"><button class="btn">Guardar documento</button><button type="button" class="btn sec" id="docx">Cancelar</button></div></form>`;
  $('#docx').onclick=()=>$('#docform').innerHTML='';
  $('#fdoc').onsubmit=async ev=>{ev.preventDefault();const d=formData(ev.target);if(await guardarArchivo(a,file,d)){toast('Documento guardado');route()}}});
 document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verFoto(S.archivos.find(x=>x.id===b.dataset.ver)));
 document.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>abrirDoc(S.archivos.find(x=>x.id===b.dataset.abrir)));
 document.querySelectorAll('[data-delar]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este documento?'))return;await del('archivos',b.dataset.delar);await borrarBlob(b.dataset.delar);route()})}
async function verFoto(ar){if(!ar)return;const u=await urlArchivo(ar);if(!u)return toast('Sin conexión: esta foto no está guardada en el teléfono');
 const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<img src="${u}" alt=""><div class="row">${ar.tipo==='foto'&&!ar.portada?'<button class="btn sec sm" data-x="p">⭐ Foto de perfil</button>':''}<button class="btn sec sm" data-x="d">⬇️ Guardar</button>${puede('borrar')?'<button class="btn bad sm" data-x="b">🗑️ Eliminar</button>':''}<button class="btn sm" data-x="c">✕ Cerrar</button></div>`;
 document.body.appendChild(ov);const cerrar=()=>ov.remove();
 ov.querySelector('[data-x=c]').onclick=cerrar;
 ov.querySelector('[data-x=d]').onclick=()=>{const l=document.createElement('a');l.href=u;l.download=(ar.nombre||'foto').replace(/\.[^.]+$/,'')+'.'+extDe(ar.mime);document.body.appendChild(l);l.click();l.remove()};
 if(ov.querySelector('[data-x=b]'))ov.querySelector('[data-x=b]').onclick=async()=>{if(!confirm('¿Eliminar esta foto?'))return;await del('archivos',ar.id);await borrarBlob(ar.id);cerrar();route()};
 const p=ov.querySelector('[data-x=p]');if(p)p.onclick=async()=>{for(const x of S.archivos.filter(x=>x.animalId===ar.animalId&&x.portada&&x.id!==ar.id)){x.portada=false;await put('archivos',x)}ar.portada=true;await put('archivos',ar);cerrar();toast('Foto de perfil actualizada');route()}}
async function abrirDoc(ar){if(!ar)return;if(ar.mime.startsWith('image/'))return verFoto(ar);const u=await urlArchivo(ar);if(!u)return toast('Sin conexión: este documento no está guardado en el teléfono');
 const l=document.createElement('a');l.href=u;l.target='_blank';l.download=(ar.nombre||'documento')+'.'+extDe(ar.mime);document.body.appendChild(l);l.click();l.remove()}

/* ================= Finanzas ================= */
const CAT_G=['Alimentación – concentrado','Alimentación – sal y minerales','Alimentación – forrajes (heno, pacas, ensilaje)','Alimentación – otros (melaza, suplementos)','Sanidad – vacunas y medicamentos','Sanidad – veterinario','Reproducción (pajillas, inseminación)','Mano de obra','Pastos y potreros (abono, herbicida, semilla)','Combustible y transporte','Servicios (luz, agua, teléfono)','Instalaciones y cercas','Equipo y herramientas','Compra de ganado','Impuestos y trámites (SENASA, guías)','Otros gastos'];
const CAT_I=['Venta de leche','Venta de ganado','Venta de queso / derivados','Otros ingresos'];
const INVERSION=new Set(['Compra de ganado','Instalaciones y cercas','Equipo y herramientas']);
const UNIDADES=['saco','kg','quintal','litro','paca','dosis','frasco','unidad','animal','jornal','hora','galón','mes'];
const grupoCat=c=>c.split(' – ')[0].replace(/ \(.*$/,'');
const fmtM=v=>{v=Number(v)||0;return(v<0?'-':'')+(S.config.moneda||'₡')+Math.abs(v).toLocaleString('es-CR',{maximumFractionDigits:0})};
const movF=()=>S.movimientos.filter(m=>m.fincaId===S.config.fincaActual);
let fper={p:'mes',d:'',h:''};
function rango(){const t=hoy(),m=t.slice(0,7),y=Number(t.slice(0,4));
 if(fper.p==='mes')return[m+'-01',t];
 if(fper.p==='mesant'){const fin=addDias(m+'-01',-1);return[fin.slice(0,7)+'-01',fin]}
 if(fper.p==='tri')return[addDias(t,-89),t];
 if(fper.p==='anio')return[y+'-01-01',t];
 if(fper.p==='anioant')return[(y-1)+'-01-01',(y-1)+'-12-31'];
 if(fper.p==='otro')return[fper.d||'0000-01-01',fper.h||t];
 return['0000-01-01','9999-12-31']}
function resumen(d,h){const ms=movF().filter(m=>m.fecha>=d&&m.fecha<=h);const r={ms,ing:0,gas:0,oper:0,gG:{},gI:{},lVend:0,mLeche:0,lProd:0};
 for(const m of ms){if(m.tipo==='ingreso'){r.ing+=m.monto;r.gI[m.categoria]=(r.gI[m.categoria]||0)+m.monto;if(m.categoria==='Venta de leche'){r.mLeche+=m.monto;if(Number(m.cantidad)>0)r.lVend+=Number(m.cantidad)}}
  else{r.gas+=m.monto;const g=grupoCat(m.categoria);r.gG[g]=(r.gG[g]||0)+m.monto;if(!INVERSION.has(m.categoria))r.oper+=m.monto}}
 const ids=new Set(animalesF(true).map(a=>a.id));for(const e of S.eventos)if(e.tipo==='leche'&&e.fecha>=d&&e.fecha<=h&&ids.has(e.animalId))r.lProd+=litros(e);return r}
function barras(obj,total){const ks=Object.keys(obj).sort((a,b)=>obj[b]-obj[a]);const mx=Math.max(1,...ks.map(k=>obj[k]));
 return ks.map(k=>`<div class="hb"><div class="n" title="${esc(k)}">${esc(k)}</div><div class="b"><div style="width:${obj[k]/mx*100}%"></div></div><div class="v">${fmtM(obj[k])}${total?' · '+Math.round(obj[k]/total*100)+'%':''}</div></div>`).join('')}
function movHtml(m){const a=m.animalId?animal(m.animalId):null;return`<a class="it" href="#/mov/${m.id}"><div class="av" style="font-size:16px">${m.tipo==='ingreso'?'➕':'➖'}</div><div class="sp" style="min-width:0"><b>${esc(m.categoria)}</b><div class="sub">${fmtF(m.fecha)}${m.descripcion?' · '+esc(m.descripcion):''}${m.loteId?' · '+esc(loteN(m.loteId)):''}${a&&!(m.descripcion||'').includes(a.codigo)?' · '+esc(nombreA(a)):''}</div></div><b class="${m.tipo==='ingreso'?'pos':'neg'}" style="white-space:nowrap">${m.tipo==='gasto'?'-':''}${fmtM(m.monto)}</b></a>`}
function finResumenCard(){const t=hoy();const r=resumen(t.slice(0,7)+'-01',t);
 if(!movF().length)return`<div class="card"><div class="row"><b>💰 Finanzas</b><span class="sp"></span><a class="btn sm sec" href="#/finanzas">Abrir</a></div><p class="sub" style="margin:6px 0 0">Anota tus gastos (concentrado, vacunas, mano de obra…) y ventas de leche o ganado para ver tu ganancia del mes.</p></div>`;
 return`<a class="card" href="#/finanzas" style="display:block;text-decoration:none;color:inherit"><div class="row"><b>💰 Finanzas de este mes</b><span class="sp"></span><span class="sub">Ver más ›</span></div><div class="grid" style="margin-top:8px"><div><div class="sub">Ingresos</div><b class="pos">${fmtM(r.ing)}</b></div><div><div class="sub">Gastos</div><b class="neg">${fmtM(r.gas)}</b></div><div><div class="sub">Ganancia</div><b class="${r.ing-r.gas>=0?'pos':'neg'}">${fmtM(r.ing-r.gas)}</b></div></div></a>`}
V.finanzas=()=>{const [d,h]=rango();const r=resumen(d,h);const gan=r.ing-r.gas;
 const lista=r.ms.slice().sort((x,y)=>y.fecha.localeCompare(x.fecha)||(y.mod||0)-(x.mod||0));
 $('#app').innerHTML=`<div class="row"><h2 class="sp">💰 Finanzas</h2><select id="fp" style="width:auto">${selOpts([['mes','Este mes'],['mesant','Mes anterior'],['tri','Últimos 3 meses'],['anio','Este año'],['anioant','Año anterior'],['todo','Todo'],['otro','Otras fechas…']],fper.p)}</select></div>
 ${fper.p==='otro'?`<div class="card f2"><div><label>Desde</label><input type="date" id="fd" value="${fper.d}"></div><div><label>Hasta</label><input type="date" id="fh" value="${fper.h||hoy()}"></div></div>`:''}
 <div class="acts" style="margin-bottom:12px"><a class="btn" href="#/mov/nuevo/gasto">➖ Gasto</a><a class="btn" href="#/mov/nuevo/ingreso">➕ Ingreso</a><a class="btn sec" href="#/mov/nuevo/leche">🥛 Venta de leche</a></div>
 <div class="grid"><div class="stat"><div class="v pos">${fmtM(r.ing)}</div><div class="l">Ingresos</div></div><div class="stat"><div class="v neg">${fmtM(r.gas)}</div><div class="l">Gastos</div></div><div class="stat"><div class="v ${gan>=0?'pos':'neg'}">${fmtM(gan)}</div><div class="l">Ganancia${r.ing?' · margen '+Math.round(gan/r.ing*100)+'%':''}</div></div></div>
 ${r.lProd||r.lVend?`<div class="card"><b>🥛 Leche</b><div class="grid" style="margin-top:8px"><div><div class="sub">Producidos (registrados)</div><b>${num(r.lProd,0)} L</b></div><div><div class="sub">Vendidos</div><b>${num(r.lVend,0)} L</b></div><div><div class="sub">Precio promedio</div><b>${r.lVend?fmtM(r.mLeche/r.lVend)+'/L':'—'}</b></div><div><div class="sub">Costo de producción</div><b>${r.lProd?fmtM(r.oper/r.lProd)+'/L':'—'}</b></div></div><p class="sub" style="margin:8px 0 0">Costo por litro = gastos de operación del período (sin compra de ganado, instalaciones ni equipo) ÷ litros registrados en el ordeño.</p></div>`:''}
 ${r.gas?`<div class="card"><b>¿En qué se va la plata?</b><div style="margin-top:8px">${barras(r.gG,r.gas)}</div>${r.gas-r.oper>0?`<p class="sub" style="margin:6px 0 0">Incluye ${fmtM(r.gas-r.oper)} en inversiones (ganado, instalaciones, equipo).</p>`:''}</div>`:''}
 ${r.ing?`<div class="card"><b>Ingresos por tipo</b><div style="margin-top:8px">${barras(r.gI,r.ing)}</div></div>`:''}
 <div class="card list"><b>Movimientos (${lista.length})</b>${lista.slice(0,150).map(movHtml).join('')||'<div class="empty">No hay movimientos en este período.</div>'}</div>
 <details class="card"><summary><b>¿Cómo llevar los gastos?</b></summary><p>No hace falta medir lo que come cada animal. Anota cada <b>compra</b> el día que la haces (sacos de concentrado, sal, pacas, vacunas, pago de peones, diésel…) con su categoría, y cada <b>venta</b> (leche, terneros, toros).</p><p>Si un gasto es solo de un grupo, asígnalo a un <b>lote</b> (ej. "Lote ordeño"); si es de un animal, elígelo. Los costos de vacunas, tratamientos e inseminaciones que anotes en la ficha del animal, y las ventas de ganado, se agregan aquí solos.</p><p>Para la leche: anota cada pago de la lechería como <b>Venta de leche</b> con los litros y el precio por litro; así la app calcula el precio promedio y tu costo por litro.</p></details>
 <a class="btn sec sm" href="#/informes/movs">📊 Exportar a Excel</a>`;
 $('#fp').onchange=e=>{fper.p=e.target.value;V.finanzas()};
 if($('#fd')){$('#fd').onchange=e=>{fper.d=e.target.value;V.finanzas()};$('#fh').onchange=e=>{fper.h=e.target.value;V.finanzas()}}};
V.mov=(id,tipo,animalId)=>{let m;const nuevo=id==='nuevo';
 if(nuevo){m={tipo:tipo==='ingreso'||tipo==='leche'?'ingreso':'gasto',fecha:hoy(),animalId:animalId||'',loteId:animalId?(animal(animalId)?.loteId||''):''};if(tipo==='leche')Object.assign(m,{categoria:'Venta de leche',unidad:'litro'})}
 else{m=S.movimientos.find(x=>x.id===id);if(!m)return go('#/finanzas')}
 const ing=m.tipo==='ingreso',leche=m.categoria==='Venta de leche';const volver=animalId?'#/animal/'+animalId+'/finanzas':'#/finanzas';
 const cats=ing?CAT_I:CAT_G;
 $('#app').innerHTML=`<h2>${nuevo?(leche?'🥛 Venta de leche':ing?'➕ Nuevo ingreso':'➖ Nuevo gasto'):(ing?'Editar ingreso':'Editar gasto')}</h2>
 ${m.eventoId?'<p class="tag i">Creado automáticamente desde un registro del animal.</p>':''}
 <form class="card" id="fm"><div class="f2"><div><label>Categoría *</label><select name="categoria" required>${selOpts(cats,m.categoria,'Elegir…')}</select></div><div><label>Fecha *</label><input type="date" name="fecha" required value="${esc(m.fecha)}"></div></div>
 <label>Descripción</label><input name="descripcion" value="${esc(m.descripcion)}" placeholder="${ing?'Ej. Pago quincena lechería':'Ej. Concentrado 20% proteína'}">
 <div class="f2"><div><label>${leche?'Litros vendidos':'Cantidad (opcional)'}</label><input type="number" step="any" min="0" name="cantidad" id="mc" value="${esc(m.cantidad)}" inputmode="decimal"></div><div><label>Unidad</label><select name="unidad">${selOpts(UNIDADES,m.unidad,'—')}</select></div>
 <div><label>${leche?'Precio por litro':'Precio por unidad (opcional)'}</label><input type="number" step="any" min="0" name="precioUnit" id="mp" value="${esc(m.precioUnit)}" inputmode="decimal"></div><div><label>Monto total (${esc(S.config.moneda||'₡')}) *</label><input type="number" step="any" min="0" name="monto" id="mm" required value="${esc(m.monto)}" inputmode="decimal"></div></div>
 <p class="sub" id="mhint"></p>
 <div class="f2"><div><label>${ing?'Cliente / comprador':'Proveedor'}</label><input name="tercero" value="${esc(m.tercero)}" placeholder="${leche?'Ej. Lechería, cooperativa':''}"></div>
 <div><label>Asignar a lote (opcional)</label><select name="loteId">${selOpts(lotesF().map(l=>[l.id,l.nombre]),m.loteId,'Toda la finca')}</select></div>
 <div><label>Asignar a animal (opcional)</label><select name="animalId">${selOpts(animalesF(true).sort((x,y)=>x.codigo.localeCompare(y.codigo,'es',{numeric:true})).map(a=>[a.id,nombreA(a)]),m.animalId,'—')}</select></div></div>
 <div class="row" style="margin-top:14px"><button class="btn">Guardar</button><a class="btn sec" href="${volver}">Cancelar</a><span class="sp"></span>${nuevo?'':'<button type="button" class="btn bad sm" id="mdel">Eliminar</button>'}</div></form>`;
 const calc=()=>{const c=Number($('#mc').value),p=Number($('#mp').value);if(c>0&&p>0)$('#mm').value=Math.round(c*p*100)/100};
 $('#mc').oninput=calc;$('#mp').oninput=calc;
 const hint=()=>{if($('[name=categoria]').value!=='Venta de leche'){$('#mhint').textContent='';return}const f=$('[name=fecha]').value;const ids=new Set(animalesF(true).map(a=>a.id));const l=S.eventos.filter(e=>e.tipo==='leche'&&e.fecha===f&&ids.has(e.animalId)).reduce((s,e)=>s+litros(e),0);$('#mhint').textContent=l?`Ordeño registrado ese día: ${num(l)} L.`:''};
 $('[name=fecha]').onchange=hint;$('[name=categoria]').onchange=hint;hint();
 if($('#mdel'))$('#mdel').onclick=async()=>{if(!confirm('¿Eliminar este movimiento?'))return;await del('movimientos',m.id);toast('Eliminado');go(volver)};
 $('#fm').onsubmit=async ev=>{ev.preventDefault();const d=formData(ev.target);if(!(Number(d.monto)>0))return toast('Ingresa el monto');
  const o=Object.assign({},m,d,{id:m.id||uid(),fincaId:m.fincaId||S.config.fincaActual,monto:Number(d.monto),cantidad:d.cantidad===''?'':Number(d.cantidad),precioUnit:d.precioUnit===''?'':Number(d.precioUnit)});
  await put('movimientos',o);toast('Guardado');go(volver)}};

/* ================= Inicio ================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nueva versión lista: cierra y abre la app')})}}).catch(()=>{});
(async()=>{try{db=await openDB();await loadAll();if(!S.config.fincaActual&&S.fincas[0])S.config.fincaActual=S.fincas[0].id;if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if(Sync.activa()){const lib=await Sync.cliente();if(lib){const ses=await Sync.sesion().catch(()=>null);if(!ses)Sync.necesitaLogin=true;else{N.userId=N.userId||ses.user.id;N.email=ses.user.email}}else if(!N.userId)Sync.necesitaLogin=true}
 route();if(N.userId&&!Sync.necesitaLogin)Sync.ahora()}catch(e){$('#app').innerHTML=`<div class="card">No se pudo abrir la base de datos del navegador: ${esc(e.message||e)}</div>`}})();
</script>
